# Extended Docker Compose with multiple configurations
# Use: docker-compose -f docker-compose.full.yml up --build

version: '3.8'

services:
  # Main C++ Web App
  cpp-web-app:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: cpp-embedded-web-app
    
    ports:
      - "8080:8080"
    
    environment:
      - APP_PORT=8080
      - LOG_LEVEL=info
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    restart: unless-stopped
    
    # Network
    networks:
      - app-network
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Labels for monitoring
    labels:
      - "com.example.description=C++ Embedded Web App"
      - "com.example.version=1.0"
  
  # Optional: Reverse proxy (Nginx)
  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/:/etc/nginx/ssl/:ro
    
    depends_on:
      - cpp-web-app
    
    networks:
      - app-network
    
    restart: unless-stopped
    
    profiles:
      - with-nginx  # Run with: docker-compose -f docker-compose.full.yml --profile with-nginx up
  
  # Optional: Monitoring (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    
    networks:
      - app-network
    
    restart: unless-stopped
    
    profiles:
      - with-monitoring  # Run with: --profile with-monitoring
  
  # Optional: Log aggregation (ELK Stack - simplified)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
    container_name: elasticsearch
    
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    
    ports:
      - "9200:9200"
    
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    
    networks:
      - app-network
    
    restart: unless-stopped
    
    profiles:
      - with-logging
  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.0.0
    container_name: kibana
    
    ports:
      - "5601:5601"
    
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    
    depends_on:
      - elasticsearch
    
    networks:
      - app-network
    
    restart: unless-stopped
    
    profiles:
      - with-logging

# Networks
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  prometheus-data:
    driver: local
  elasticsearch-data:
    driver: local
